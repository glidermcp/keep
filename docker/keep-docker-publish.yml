name: Publish Keep Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved native Keep alpha version
        required: true
        default: 0.1.0-alpha.3
        type: string
      image_tag:
        description: Immutable image tag with the native version and container revision
        required: true
        default: 0.1.0-alpha.3-ubuntu26.04
        type: string
      mode:
        description: Publish a new version or verify a public version
        required: true
        default: verify
        type: choice
        options: [publish, verify]
      tag_next:
        description: Point next at this verified image
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: keep-docker-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'glidermcp/keep' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Test release validation
        run: python docker/test_distribution.py
      - name: Authenticate the Docker Hub publisher
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$DOCKERHUB_USERNAME" = sacrorum
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Assemble, probe, and publish
        env:
          KEEP_VERSION: ${{ inputs.version }}
          KEEP_IMAGE_TAG: ${{ inputs.image_tag }}
          KEEP_MODE: ${{ inputs.mode }}
          TAG_NEXT: ${{ inputs.tag_next }}
        run: |
          set -euo pipefail
          args=(--version "$KEEP_VERSION" --image-tag "$KEEP_IMAGE_TAG" --mode "$KEEP_MODE" --evidence evidence)
          if [ "$TAG_NEXT" = true ]; then args+=(--tag-next); fi
          python docker/publish.py "${args[@]}"
      - name: Preserve image evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keep-docker-evidence
          path: evidence/
          if-no-files-found: warn
      - name: End registry session
        if: always()
        run: docker logout docker.io
